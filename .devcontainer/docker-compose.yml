services:
  keycloak:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ballwarekeycloak_app
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_TRANSACTION_XA_ENABLED: false
      KC_HOSTNAME: localhost
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      DEBUG_PORT: '*:8000'
      # DevExtreme LCP key for the ballware-keycloakify theme (runtime only, never baked into the image).
      # Set it in your shell or in a gitignored .devcontainer/.env; without it DevExtreme shows its trial banner (W0019).
      DEVEXTREME_LICENSE: ${DEVEXTREME_LICENSE}
    ports:
      - '8080:8080'
      - '8443:8443'
      - '8000:8000'
    volumes:
      - ..:/workspace
    command: start-dev --debug --import-realm --https-certificate-file=/workspace/localhost.pem --https-certificate-key-file=/workspace/localhost-key.pem  --hostname-strict=false --transaction-xa-enabled=false --log-level=DEBUG
    depends_on:
      - db
  db:
    image: postgres:17
    ports:
      - 5432:5432
    volumes:
      - db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak

volumes:
  db:
